---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y verilator
          verilator --version

      - name: Check repo structure
        run: |
          for d in rtl tb formal scripts sw fpga docs; do
            if [ ! -d "$d" ]; then
              echo "WARN: $d missing dir"
            else
              echo "OK: $d"
            fi
          done
          echo ">>> Structure OK!"

      - name: Makefile exists
        run: test -f Makefile && echo ">>> Makefile OK!"

      - name: Lint Check RTL
        run: make lint

